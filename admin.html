<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Test</title>
</head>

<body>

<h1>Supabase Connection Test</h1>

<div id="result">
Starting connection test...
</div>

<script type="module">

const result =
    document.getElementById("result");

result.textContent =
    "JavaScript module loaded successfully.";

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://dufqdjvjszewhhakjibb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zdE8Z15zobFjWJ0P86B5Qg_55sAbHer";


try {

    result.textContent =
        "Supabase library loaded.\n\n" +
        "Creating client...";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    result.textContent =
        "Client created.\n\n" +
        "Testing management table...";


    const response =
        await supabase
            .from("management")
            .select("*");


    if (response.error) {

        result.textContent =
            "SUPABASE ERROR\n\n" +
            response.error.message;

    } else {

        result.textContent =
            "SUCCESS!\n\n" +
            "Management rows found: " +
            response.data.length +
            "\n\n" +
            JSON.stringify(
                response.data,
                null,
                2
            );

    }

}

catch (error) {

    result.textContent =
        "JAVASCRIPT ERROR\n\n" +
        (
            error.message ||
            String(error)
        );

}

</script>

</body>
</html>
