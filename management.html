<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Yönetim | Ümmetin Işıkları
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="header">

    <div class="container nav">

        <a
            class="brand"
            href="index.html"
        >

            <span class="brand-logo">

                <img
                    src="images/logo.png"
                    alt="Logo"
                >

                <span class="logo-fallback">
                    Üİ
                </span>

            </span>


            <span>
                Ümmetin Işıkları
            </span>

        </a>


        <a
            class="button secondary"
            href="index.html#management"
        >
            ← Ana Sayfa
        </a>

    </div>

</header>


<main class="section">

    <div class="container">

        <label>
            EKİP
        </label>


        <h1
            style="
                font-size:clamp(3rem,8vw,6rem);
                margin:10px 0 20px;
            "
        >
            Yönetim
        </h1>


        <p class="section-description">

            Ümmetin Işıkları yönetim kadrosu.
            Yönetim üyelerinin fotoğrafları,
            isimleri, görevleri ve sorumlulukları
            burada gösterilir.

        </p>


        <div
            class="management-grid"
            id="managementPage"
        >

            <article class="person-card">

                <div class="avatar">
                    ...
                </div>

                <small>
                    YÖNETİM
                </small>

                <h3>
                    Yükleniyor...
                </h3>

                <p>
                    Yönetim üyeleri yükleniyor...
                </p>

            </article>

        </div>

    </div>

</main>


<script type="module">

/* =========================================
   SUPABASE
   SAME CONFIGURATION AS ADMIN.HTML
========================================= */

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://dufqdjvjszewhhakjibb.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_zdE8Z15zobFJvWJ0P86B5Qg_55sAbHer";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================
   LOAD MANAGEMENT
========================================= */

async function loadManagement() {

    const managementPage =
        document.getElementById(
            "managementPage"
        );


    try {

        const result =
            await supabase
                .from("management")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            throw result.error;

        }


        const data =
            result.data || [];


        console.log(
            "MANAGEMENT DATA:",
            data
        );


        /* =================================
           NO MEMBERS
        ================================= */

        if (data.length === 0) {

            managementPage.innerHTML = `

                <article class="person-card">

                    <div class="avatar">
                        Üİ
                    </div>

                    <small>
                        YÖNETİM
                    </small>

                    <h3>
                        Yönetim Profili
                    </h3>

                    <p>
                        Henüz yönetim profili eklenmedi.
                    </p>

                </article>

            `;

            return;

        }


        /* =================================
           DISPLAY REAL MEMBERS
        ================================= */

        managementPage.innerHTML =
            data.map(
                member => {

                    const name =
                        member.name ||
                        "İsimsiz";

                    const role =
                        member.role ||
                        "YÖNETİM";

                    const description =
                        member.description ||
                        "";

                    const photo =
                        member.photo_url ||
                        "";

                    const id =
                        member.id ||
                        "";


                    return `

                        <article
                            class="person-card"
                        >

                            <div class="avatar">

                                ${
                                    photo

                                    ?

                                    `
                                    <img
                                        src="${escapeHTML(photo)}"
                                        alt="${escapeHTML(name)}"
                                    >
                                    `

                                    :

                                    "Üİ"
                                }

                            </div>


                            <small>
                                ${escapeHTML(role)}
                            </small>


                            <h3>
                                ${escapeHTML(name)}
                            </h3>


                            ${
                                description
                                ?
                                `
                                <p>
                                    ${escapeHTML(description)}
                                </p>
                                `
                                :
                                ""
                            }


                            ${
                                id
                                ?
                                `
                                <p
                                    style="
                                        margin-top:12px;
                                        font-size:.65rem;
                                        color:#999;
                                        word-break:break-all;
                                    "
                                >
                                    ID: ${escapeHTML(id)}
                                </p>
                                `
                                :
                                ""
                            }

                        </article>

                    `;

                }
            ).join("");


    }

    catch (error) {

        console.error(
            "MANAGEMENT ERROR:",
            error
        );


        managementPage.innerHTML = `

            <article
                class="person-card"
            >

                <div class="avatar">
                    !
                </div>

                <small>
                    MANAGEMENT ERROR
                </small>

                <h3>
                    Management could not be loaded
                </h3>

                <p>
                    ${escapeHTML(
                        error.message ||
                        String(error)
                    )}
                </p>

            </article>

        `;

    }

}


/* =========================================
   START
========================================= */

loadManagement();

</script>


</body>

</html>
