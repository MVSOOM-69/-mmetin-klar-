<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Yönetim | Ümmetin Işıkları
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .management-status {
            padding: 25px;
            margin-top: 25px;

            background: white;

            border:
                1px solid var(--line);

            border-radius: 20px;

            color: var(--muted);

            text-align: center;
        }

        .management-page-id {
            display: block;

            margin-top: 8px;

            color: #999;

            font-size: .68rem;

            word-break: break-all;
        }

        .person-card .avatar {
            position: relative;
        }

        .person-card .avatar img {
            display: block;
        }

    </style>

</head>


<body>


<header class="header">

    <div class="container nav">

        <a
            class="brand"
            href="index.html"
        >

            <span class="brand-logo">

                <img
                    src="images/logo.png"
                    alt="Logo"
                >

                <span class="logo-fallback">
                    Üİ
                </span>

            </span>


            <span>
                Ümmetin Işıkları
            </span>

        </a>


        <a
            class="button secondary"
            href="index.html#management"
        >
            ← Ana Sayfa
        </a>

    </div>

</header>


<main class="section">

    <div class="container">

        <label>
            EKİP
        </label>


        <h1
            style="
                font-size:clamp(3rem,8vw,6rem);
                margin:10px 0 20px;
            "
        >
            Yönetim
        </h1>


        <p class="section-description">

            Ümmetin Işıkları yönetim kadrosu.
            Yönetim üyelerinin fotoğrafları,
            isimleri, görevleri ve sorumlulukları
            burada gösterilir.

        </p>


        <div
            class="management-grid"
            id="managementPage"
        >

            <article class="management-status">
                Yönetim üyeleri yükleniyor...
            </article>

        </div>

    </div>

</main>


<script>

/* =========================================
   SUPABASE SETTINGS
   EXISTING PROJECT — READ ONLY
========================================= */

const SUPABASE_URL =
    "https://dufqdjvjszewhhakjibb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zdE8Z15zobFJvWJ0P86B5Qg_55sAbHer";


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================
   LOAD MANAGEMENT MEMBERS
========================================= */

async function loadManagementPage() {

    const managementPage =
        document.getElementById(
            "managementPage"
        );


    if (!managementPage) {
        return;
    }


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/management?select=*",
                {
                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    }
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                "Supabase HTTP " +
                response.status +
                ": " +
                errorText
            );

        }


        const data =
            await response.json();


        console.log(
            "Management page data:",
            data
        );


        /* =================================
           NO MANAGEMENT MEMBERS
        ================================= */

        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            managementPage.innerHTML = `

                <article class="management-status">

                    <h3>
                        Yönetim profili bulunamadı
                    </h3>

                    <p style="margin-top:7px;">
                        Henüz yönetim üyesi eklenmemiş.
                    </p>

                </article>

            `;

            return;

        }


        /* =================================
           CREATE REAL MANAGEMENT CARDS
        ================================= */

        managementPage.innerHTML =
            data.map(
                person => {

                    const id =
                        person.id ??
                        "";

                    const name =
                        person.name ||
                        "İsimsiz";

                    const role =
                        person.role ||
                        "YÖNETİM";

                    const description =
                        person.description ||
                        "";

                    const image =
                        person.photo_url ||
                        "";


                    return `

                        <article
                            class="person-card"
                        >

                            <div class="avatar">

                                ${
                                    image

                                    ?

                                    `
                                    <img
                                        src="${escapeHTML(image)}"
                                        alt="${escapeHTML(name)}"
                                        loading="lazy"
                                    >
                                    `

                                    :

                                    `
                                    Üİ
                                    `
                                }

                            </div>


                            <small>
                                ${escapeHTML(role)}
                            </small>


                            <h3>
                                ${escapeHTML(name)}
                            </h3>


                            ${
                                description

                                ?

                                `
                                <p>
                                    ${escapeHTML(description)}
                                </p>
                                `

                                :

                                ""
                            }


                            ${
                                id

                                ?

                                `
                                <span
                                    class="management-page-id"
                                >
                                    ID: ${escapeHTML(id)}
                                </span>
                                `

                                :

                                ""
                            }

                        </article>

                    `;

                }
            ).join("");


    }

    catch (error) {

        console.error(
            "MANAGEMENT PAGE ERROR:",
            error
        );


        managementPage.innerHTML = `

            <article class="management-status">

                <h3>
                    Yönetim yüklenemedi
                </h3>

                <p style="margin-top:7px;">
                    Yönetim bilgileri şu anda
                    yüklenemiyor.
                </p>

            </article>

        `;

    }

}


/* =========================================
   START
========================================= */

loadManagementPage();

</script>


</body>

</html>
